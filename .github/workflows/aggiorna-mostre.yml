# Ogni giorno legge i siti delle gallerie e aggiorna dati/mostre.json.
# Si può avviare anche a mano: scheda "Actions" → "Aggiorna mostre" → "Run workflow".
name: Aggiorna mostre

on:
  schedule:
    - cron: "23 5 * * *"   # ogni giorno alle 5:23 UTC (6:23 o 7:23 in Italia)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-mostre
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Installa
        working-directory: scraper
        run: npm ci --omit=dev

      - name: Leggi le gallerie
        working-directory: scraper
        run: node aggiorna.js

      - name: Salva se qualcosa è cambiato
        run: |
          if git diff --quiet -- dati/mostre.json; then
            echo "Nessuna novità."
          else
            git config user.name "Salone Lamponi (automatico)"
            git config user.email "actions@users.noreply.github.com"
            git add dati/mostre.json
            git commit -m "Mostre aggiornate $(date -u +%Y-%m-%d)"
            git push
          fi
